<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320">
  <defs>
    <!-- Arrow marker -->
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-dashed" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#666"/>
    </marker>
  </defs>

  <!-- System Boundary (dashed red box) -->
  <rect x="30" y="40" width="420" height="240" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,3" rx="6"/>
  <text x="240" y="28" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">System Boundary</text>

  <!-- Environmental Variety (top) -->
  <text x="300" y="62" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle">Environmental Variety</text>
  <line x1="300" y1="68" x2="300" y2="88" stroke="#666" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrowhead-dashed)"/>

  <!-- Governance (Controller) - Blue rounded rectangle -->
  <rect x="60" y="95" width="110" height="60" rx="8" fill="#e8f4fd" stroke="#3498db" stroke-width="1.5"/>
  <text x="115" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="middle">Governance</text>
  <text x="115" y="135" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">(Controller)</text>

  <!-- Infrastructure (Code & Execution) - Blue rounded rectangle -->
  <rect x="250" y="95" width="110" height="60" rx="8" fill="#e8f4fd" stroke="#3498db" stroke-width="1.5"/>
  <text x="305" y="120" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="middle">Infrastructure</text>
  <text x="305" y="135" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">(Code &amp; Execution)</text>

  <!-- Audit (Sensor) - Green circle -->
  <circle cx="410" cy="200" r="35" fill="#e8f8e8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="410" y="196" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50" text-anchor="middle">Audit</text>
  <text x="410" y="210" font-family="Arial, sans-serif" font-size="9" fill="#666" text-anchor="middle">(Sensor)</text>

  <!-- User Will (Reference) - Yellow diamond -->
  <polygon points="115,200 165,248 115,296 65,248" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="115" y="244" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2c3e50" text-anchor="middle">User Will</text>
  <text x="115" y="258" font-family="Arial, sans-serif" font-size="8" fill="#666" text-anchor="middle">(Reference)</text>

  <!-- Arrows -->
  <!-- Governance -> Infrastructure (Rule Application) -->
  <line x1="170" y1="125" x2="245" y2="125" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="207" y="118" font-family="Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle">Rule Application</text>

  <!-- Infrastructure -> Audit (Impact/Output) -->
  <path d="M 360 125 Q 410 125 410 162" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="395" y="142" font-family="Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle">Impact</text>

  <!-- Audit -> User Will (Observed Error) -->
  <path d="M 375 200 Q 270 248 170 248" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <text x="268" y="265" font-family="Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle">Observed Error</text>

  <!-- User Will -> Governance (Correction Signal) -->
  <line x1="115" y1="200" x2="115" y2="160" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="80" y="182" font-family="Arial, sans-serif" font-size="8" fill="#555" text-anchor="middle" transform="rotate(-90, 80, 182)">Correction</text>

  <!-- EXIT arrow (external input to User Will) -->
  <line x1="15" y1="248" x2="60" y2="248" stroke="#333" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- TEST LABELS (Red, Bold) -->
  <!-- 1. EXIT -->
  <text x="38" y="235" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">1. EXIT</text>

  <!-- 2. CODE -->
  <text x="207" y="108" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">2. CODE</text>

  <!-- 3. AUDIT -->
  <text x="455" y="200" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">3. AUDIT</text>

  <!-- 4. GOVERN -->
  <text x="62" y="182" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">4. GOVERN</text>

  <!-- 5. FORK -->
  <text x="390" y="150" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">5. FORK</text>
</svg>
